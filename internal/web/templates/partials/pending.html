{{/* Stands in for a page whose behaviour lands in a later phase. The layout,
     the navigation and the access rules are real, so each page can be reached
     and guarded before its contents exist. */}}
{{define "pending"}}
<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h5 class="mb-0">{{.Heading}}</h5>
  </div>
  <div class="card-body">
    <p class="mb-0">{{.Note}}</p>
  </div>
</div>
{{end}}
