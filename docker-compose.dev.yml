# Development stack for the JBound panel.
#
# One panel, six throwaway Unbound targets and a SIEM sink. Three targets are
# reached over SSH and three through the agent, so one record written to the
# resolvers group proves both transports rather than proving each on its own.
#
# Host port blocks 8330-8339 and 8360-8369, reserved in
# ~/.claude/docker-ports.md.
#
# Start with: make dev-up

name: jbound

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: jbound-app
    env_file:
      - .env.dev
    environment:
      SRC_DIR: /src
      KEY_DIR: /keys
    volumes:
      # Bind mounted source so air rebuilds on edit.
      - .:/src
      - ./docker/keys:/keys:ro
      - jbound-data:/var/lib/jbound
      - jbound-gocache:/go/cache
      - jbound-gomod:/go/pkg/mod
    ports:
      - "127.0.0.1:8330:8080"
    networks:
      - jbound-net
    depends_on:
      - dns1
      - dns2
      - dns3
      - dns4
      - dns5
      - dns6
      - siem-sink

  dns1:
    build:
      context: .
      dockerfile: docker/Dockerfile.dnstarget
    container_name: jbound-dns1
    environment:
      SSH_USER: dnsops
      SEED_FILE: /seed/dns1.conf
      PUBLIC_KEY_FILE: /keys/dev_ed25519.pub
      SHELL_POLLUTION: "0"
    volumes:
      - ./docker/seed:/seed:ro
      # The public half only. A target authorises the panel with it and never
      # reads the private key, so mounting the directory would put the
      # credential that opens the other two targets inside each one.
      - ./docker/keys/dev_ed25519.pub:/keys/dev_ed25519.pub:ro
    ports:
      - "127.0.0.1:8331:53/tcp"
      - "127.0.0.1:8331:53/udp"
      - "127.0.0.1:8334:22"
    networks:
      - jbound-net

  dns2:
    build:
      context: .
      dockerfile: docker/Dockerfile.dnstarget
    container_name: jbound-dns2
    environment:
      SSH_USER: dnsops
      SEED_FILE: /seed/dns2.conf
      PUBLIC_KEY_FILE: /keys/dev_ed25519.pub
      SHELL_POLLUTION: "0"
    volumes:
      - ./docker/seed:/seed:ro
      - ./docker/keys/dev_ed25519.pub:/keys/dev_ed25519.pub:ro
    ports:
      - "127.0.0.1:8332:53/tcp"
      - "127.0.0.1:8332:53/udp"
      - "127.0.0.1:8335:22"
    networks:
      - jbound-net

  dns3:
    build:
      context: .
      dockerfile: docker/Dockerfile.dnstarget
    container_name: jbound-dns3
    environment:
      SSH_USER: dnsops
      SEED_FILE: /seed/dns3.conf
      PUBLIC_KEY_FILE: /keys/dev_ed25519.pub
      # No remote control on this one, on purpose. The panel's first reload
      # rung has nothing to talk to here, so every run proves the fall through
      # to the second rung rather than only proving the happy path.
      REMOTE_CONTROL: "0"
      # The integration test flips this on only for the shell pollution check.
      SHELL_POLLUTION: "${SHELL_POLLUTION:-0}"
    volumes:
      - ./docker/seed:/seed:ro
      - ./docker/keys/dev_ed25519.pub:/keys/dev_ed25519.pub:ro
    ports:
      - "127.0.0.1:8333:53/tcp"
      - "127.0.0.1:8333:53/udp"
      - "127.0.0.1:8336:22"
    networks:
      - jbound-net

  # --- Agent targets -------------------------------------------------------
  # No sshd, no sudo and no account. The panel sends no command text and names
  # no file, so there is nothing for a login shell to run and nothing for sudo
  # to allow. That absence is what these three are here to keep honest.
  dns4:
    build:
      context: .
      dockerfile: docker/Dockerfile.agenttarget
    container_name: jbound-dns4
    environment:
      AGENT_TOKEN: "${DEV_AGENT_TOKEN}"
      SEED_FILE: /seed/dns1.conf
    volumes:
      - ./docker/seed:/seed:ro
    ports:
      - "127.0.0.1:8360:53/tcp"
      - "127.0.0.1:8360:53/udp"
      - "127.0.0.1:8363:8443"
    networks:
      - jbound-net

  dns5:
    build:
      context: .
      dockerfile: docker/Dockerfile.agenttarget
    container_name: jbound-dns5
    environment:
      AGENT_TOKEN: "${DEV_AGENT_TOKEN}"
      SEED_FILE: /seed/dns2.conf
      # No include line in the main configuration on purpose. That failure is
      # invisible everywhere else, a write lands, the check passes, the reload
      # succeeds and no record resolves, so a target that reproduces it on
      # every run is the only way the repair stays proven.
      MAIN_INCLUDE: "0"
    volumes:
      - ./docker/seed:/seed:ro
    ports:
      - "127.0.0.1:8361:53/tcp"
      - "127.0.0.1:8361:53/udp"
      - "127.0.0.1:8364:8443"
    networks:
      - jbound-net

  dns6:
    build:
      context: .
      dockerfile: docker/Dockerfile.agenttarget
    container_name: jbound-dns6
    environment:
      AGENT_TOKEN: "${DEV_AGENT_TOKEN}"
      SEED_FILE: /seed/dns3.conf
    volumes:
      - ./docker/seed:/seed:ro
    ports:
      - "127.0.0.1:8362:53/tcp"
      - "127.0.0.1:8362:53/udp"
      - "127.0.0.1:8365:8443"
    networks:
      - jbound-net

  siem-sink:
    build:
      context: .
      dockerfile: docker/Dockerfile.siemsink
    container_name: jbound-siem-sink
    ports:
      - "127.0.0.1:8337:514"
    networks:
      - jbound-net

networks:
  jbound-net:
    name: jbound-net

volumes:
  jbound-data:
  jbound-gocache:
  jbound-gomod:
