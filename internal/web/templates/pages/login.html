{{define "content"}}
<div class="card">
  <div class="card-body">
    <div class="app-brand justify-content-center mb-4">
      <h1 class="app-brand-text demo text-body fw-bolder brand-title mb-0">{{t "login.heading"}}</h1>
    </div>
    <p class="mb-4 text-center">{{t "login.lead"}}</p>

    <div id="login-alert" aria-live="polite">{{if .Alert}}{{template "alert" .Alert}}{{end}}</div>

    <form id="login-form" class="mb-3" method="post" action="/login"
          hx-post="/login" hx-target="#login-alert" hx-swap="innerHTML"
          hx-disabled-elt="#login-button">
      <div class="mb-3">
        <label for="username" class="form-label">{{t "login.username"}}</label>
        <input type="text" class="form-control" id="username" name="username"
               placeholder="{{t "login.username_placeholder"}}" autocomplete="username"
               autocapitalize="none" spellcheck="false" autofocus required>
      </div>

      <div class="mb-3 form-password-toggle">
        <label for="password" class="form-label">{{t "login.password"}}</label>
        <div class="input-group input-group-merge">
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                 autocomplete="current-password" required>
          {{/* A button rather than a span with a role, so a keyboard reaches it
               the way it reaches every other control. */}}
          <button type="button" class="input-group-text cursor-pointer"
                  data-action="toggle-password" data-target="password"
                  aria-label="{{t "login.password_toggle"}}">
            <i class="bx bx-hide" data-role="toggle-icon" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <button class="btn btn-primary d-grid w-100" type="submit" id="login-button">
          <span>{{t "login.submit"}}</span>
        </button>
      </div>
    </form>
  </div>
</div>
{{end}}
