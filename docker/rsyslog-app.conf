# Base rsyslog configuration for the development panel container.
#
# The panel writes its own forwarding rules to
# /etc/rsyslog.d/60-unbound-dns-panel.conf. This file only sets up the modules
# and the include, so the panel file stays the single place a developer edits
# through the SIEM page.

module(load="imuxsock")

$WorkDirectory /var/spool/rsyslog
$RepeatedMsgReduction on

# Panel rules land here.
$IncludeConfig /etc/rsyslog.d/*.conf

# Anything not matched by the panel rules goes to the container log.
*.* /dev/stdout
