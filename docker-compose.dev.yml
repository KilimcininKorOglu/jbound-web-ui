# Development stack for the JBound panel.
#
# One panel plus three throwaway Unbound targets plus a SIEM sink. The panel
# reaches the targets over SSH exactly as it would in production.
#
# Host port block 8330-8339, reserved in ~/.claude/docker-ports.md.
#
# Start with: make dev-up

name: jbound

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: jbound-app
    env_file:
      - .env.dev
    environment:
      SRC_DIR: /src
      KEY_DIR: /keys
    volumes:
      # Bind mounted source so air rebuilds on edit.
      - .:/src
      - ./docker/keys:/keys:ro
      - jbound-data:/var/lib/jbound
      - jbound-gocache:/go/cache
      - jbound-gomod:/go/pkg/mod
    ports:
      - "127.0.0.1:8330:8080"
    networks:
      - jbound-net
    depends_on:
      - dns1
      - dns2
      - dns3
      - siem-sink

  dns1:
    build:
      context: .
      dockerfile: docker/Dockerfile.dnstarget
    container_name: jbound-dns1
    environment:
      SSH_USER: dnsops
      SEED_FILE: /seed/dns1.conf
      PUBLIC_KEY_FILE: /keys/dev_ed25519.pub
      SHELL_POLLUTION: "0"
    volumes:
      - ./docker/seed:/seed:ro
      # The public half only. A target authorises the panel with it and never
      # reads the private key, so mounting the directory would put the
      # credential that opens the other two targets inside each one.
      - ./docker/keys/dev_ed25519.pub:/keys/dev_ed25519.pub:ro
    ports:
      - "127.0.0.1:8331:53/tcp"
      - "127.0.0.1:8331:53/udp"
      - "127.0.0.1:8334:22"
    networks:
      - jbound-net

  dns2:
    build:
      context: .
      dockerfile: docker/Dockerfile.dnstarget
    container_name: jbound-dns2
    environment:
      SSH_USER: dnsops
      SEED_FILE: /seed/dns2.conf
      PUBLIC_KEY_FILE: /keys/dev_ed25519.pub
      SHELL_POLLUTION: "0"
    volumes:
      - ./docker/seed:/seed:ro
      - ./docker/keys/dev_ed25519.pub:/keys/dev_ed25519.pub:ro
    ports:
      - "127.0.0.1:8332:53/tcp"
      - "127.0.0.1:8332:53/udp"
      - "127.0.0.1:8335:22"
    networks:
      - jbound-net

  dns3:
    build:
      context: .
      dockerfile: docker/Dockerfile.dnstarget
    container_name: jbound-dns3
    environment:
      SSH_USER: dnsops
      SEED_FILE: /seed/dns3.conf
      PUBLIC_KEY_FILE: /keys/dev_ed25519.pub
      # The integration test flips this on only for the shell pollution check.
      SHELL_POLLUTION: "${SHELL_POLLUTION:-0}"
    volumes:
      - ./docker/seed:/seed:ro
      - ./docker/keys/dev_ed25519.pub:/keys/dev_ed25519.pub:ro
    ports:
      - "127.0.0.1:8333:53/tcp"
      - "127.0.0.1:8333:53/udp"
      - "127.0.0.1:8336:22"
    networks:
      - jbound-net

  siem-sink:
    build:
      context: .
      dockerfile: docker/Dockerfile.siemsink
    container_name: jbound-siem-sink
    ports:
      - "127.0.0.1:8337:514"
    networks:
      - jbound-net

networks:
  jbound-net:
    name: jbound-net

volumes:
  jbound-data:
  jbound-gocache:
  jbound-gomod:
