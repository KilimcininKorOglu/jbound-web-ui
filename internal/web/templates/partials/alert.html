{{/* One message rendered into the page. Toasts are for the result of an
     action, alerts are for the state of the page in front of the reader. */}}
{{define "alert"}}
<div class="alert alert-{{if eq .Severity "error"}}danger{{else}}{{.Severity}}{{end}} alert-dismissible mb-3"
     role="alert" data-alert="{{.Severity}}">
  {{.Message}}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{{end}}
