# Hot reload configuration for the development container.
# The panel binary is rebuilt whenever a Go source, template, static asset or
# language file changes. Production builds go through the Makefile instead.

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/jbound ./cmd/jbound"
  bin = "./tmp/jbound"
  include_ext = ["go", "html", "css", "js", "sql", "json"]
  exclude_dir = ["tmp", "dist", "docker", "deploy", "scripts", "helper-projects", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  # Poll instead of waiting for file system events. The source arrives through
  # a bind mount, and a mount on macOS or Windows does not deliver an event for
  # every change, so an edit to a template or an asset would go unnoticed until
  # the next Go change forced a rebuild.
  poll = true
  poll_interval = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = true

[misc]
  clean_on_exit = true
