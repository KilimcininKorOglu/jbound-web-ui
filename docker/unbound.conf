# Minimal Unbound configuration for the development target containers.
#
# This file replaces the distribution default on purpose. It does not pull in
# /etc/unbound/unbound.conf.d, so the automatic root trust anchor is not
# configured. The dev targets only answer from local data.

server:
    verbosity: 1
    interface: 0.0.0.0
    interface: ::0
    port: 53

    # The panel and the host both query these containers.
    access-control: 0.0.0.0/0 allow
    access-control: ::/0 allow

    do-daemonize: no
    chroot: ""
    username: ""
    directory: "/etc/unbound"
    pidfile: "/run/unbound.pid"
    use-syslog: no
    logfile: ""

    do-not-query-localhost: no
    hide-identity: yes
    hide-version: yes

    # Records managed by the panel live here. The panel reads and rewrites
    # this file over SSH.
    include: /etc/unbound/host_entries.conf

# remote-control stays off. The panel reloads through "service unbound reload",
# which is the same command it runs in production. Enabling it here would
# require generating control certificates that nothing uses.
