# rsyslog configuration for the siem-sink development container.
#
# Stands in for a SIEM collector. It accepts the events the panel sends over
# TCP 514 and writes them to a file the integration test reads.

module(load="imtcp")
input(type="imtcp" port="514")

$WorkDirectory /var/spool/rsyslog

# app-name rather than syslogtag, because the panel sends RFC 5424 and that
# format carries the program name without the trailing colon a legacy tag has.
# Concatenating the two would print jboundCEF:0|... and hide where one ends.
template(name="SinkFormat" type="string"
    string="%timegenerated:::date-rfc3339% %HOSTNAME% %app-name%: %msg%\n"
)

# Everything that arrives over the network is recorded, so the test can assert
# on the CEF payload the panel forwarded.
*.* /var/log/siem-sink.log;SinkFormat

# Also mirror to the container log for interactive debugging.
*.* /dev/stdout;SinkFormat
