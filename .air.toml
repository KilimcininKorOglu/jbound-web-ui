# Hot reload configuration for the development container.
# The panel binary is rebuilt whenever a Go source, template or static asset
# changes. Production builds go through the Makefile instead.

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/unbound-web ./cmd/unbound-web"
  bin = "./tmp/unbound-web"
  include_ext = ["go", "html", "css", "js", "sql"]
  exclude_dir = ["tmp", "dist", "docker", "deploy", "scripts", "helper-projects", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = true

[misc]
  clean_on_exit = true
