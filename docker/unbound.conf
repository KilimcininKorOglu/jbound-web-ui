# Minimal Unbound configuration for the development target containers.
#
# This file replaces the distribution default on purpose. It does not pull in
# /etc/unbound/unbound.conf.d, so the automatic root trust anchor is not
# configured. The dev targets only answer from local data.

server:
    verbosity: 1
    interface: 0.0.0.0
    interface: ::0
    port: 53

    # The panel and the host both query these containers.
    access-control: 0.0.0.0/0 allow
    access-control: ::/0 allow

    # The init script starts and stops this daemon, because that is what the
    # panel's reload commands drive. It has to fork for start-stop-daemon to
    # see it start.
    do-daemonize: yes
    chroot: ""
    username: ""
    directory: "/etc/unbound"
    pidfile: "/run/unbound.pid"
    use-syslog: no
    logfile: ""

    do-not-query-localhost: no
    hide-identity: yes
    hide-version: yes

    # Records managed by the panel live here. The panel reads and rewrites
    # this file over SSH.
    include: /etc/unbound/host_entries.conf

# remote-control is what the first rung of the panel's reload speaks. It
# preserves the resolver cache, which is the whole reason that rung comes
# first, so the stack has to be able to exercise it.
#
# The entrypoint of dns3 removes this file's control section, so that target
# falls through to the second rung on every reload and the escalation is
# proven on every run rather than only when something breaks.
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
